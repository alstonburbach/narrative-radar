name: discover narratives

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "43 13 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Optional sector or theme to investigate
        required: false
        default: crypto narratives
        type: string
      chain:
        description: Optional chain filter
        required: false
        default: unknown
        type: string
      limit:
        description: Results per research lens
        required: false
        default: "5"
        type: string
      provider:
        description: Research provider; auto uses Tavily when its key exists
        required: false
        default: public_rss
        type: choice
        options:
          - public_rss
          - auto
          - tavily

concurrency:
  group: narrative-radar-discovery-feed
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      TOPIC: ${{ inputs.topic || 'crypto narratives' }}
      CHAIN: ${{ inputs.chain || 'unknown' }}
      LIMIT: ${{ inputs.limit || '10' }}
      NARRATIVE_RESEARCH_PROVIDER: ${{ inputs.provider || (github.event.schedule == '43 13 * * *' && 'auto' || 'public_rss') }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore discovery history
        uses: actions/cache@v4
        with:
          path: data/narrative_radar.db
          key: narrative-radar-discovery-db-${{ github.run_id }}
          restore-keys: narrative-radar-discovery-db-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover narrative leads
        run: python -m app.discovery_main --topic "$TOPIC" --chain "$CHAIN" --limit "$LIMIT" --json > narrative-discovery.json
      - name: Render phone report and notification decision
        run: >-
          python -m app.discovery_report_main narrative-discovery.json
          --markdown-output narrative-discovery.md
          --notification-output discovery-notification.json
      - name: Write job summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("narrative-discovery.json", "r", encoding="utf-8") as handle:
              report = json.load(handle)
          quality = report.get("quality", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(f"## Narrative discovery: {report.get('topic')}\\n")
              handle.write(f"- Status: `{report.get('status')}`\\n")
              handle.write(f"- Research provider: requested=`{report.get('research_provider_requested')}`, active=`{report.get('research_provider')}`, deep web scan=`{report.get('deep_research_active')}`\\n")
              if report.get("provider_fallback_reason"):
                  handle.write(f"- Provider fallback: `{report.get('provider_fallback_reason')}`\\n")
              handle.write(f"- Evidence quality: `{quality.get('quality_score')}/100` ({quality.get('classification')})\\n")
              handle.write(f"- Independent domains: `{report.get('independent_domain_count')}`\\n")
              handle.write(f"- Syndicated copies excluded: `{quality.get('syndication', {}).get('collapsed_source_count', 0)}` across `{quality.get('syndication', {}).get('cluster_count', 0)}` clusters\\n")
              handle.write(f"- Evidence freshness: `{quality.get('freshness', {}).get('status', 'unknown')}`; recent=`{quality.get('freshness', {}).get('recent_count', 0)}`, undated=`{quality.get('freshness', {}).get('undated_count', 0)}`\\n")
              handle.write(f"- Lead count: `{report.get('lead_count')}`\\n")
              handle.write("\\nCandidate signals:\\n")
              for signal in report.get("candidate_signals", [])[:10]:
                  handle.write(f"- `{signal.get('label')}` — domains={signal.get('independent_domains')}, lenses={signal.get('lenses')}\\n")
              handle.write("\\nAutomatic watch options:\\n")
              for option in report.get("narrative_options", [])[:5]:
                  handle.write(
                      f"- `{option.get('label')}` — {option.get('status')}; "
                      f"buy review={option.get('possible_buy_review_status')}\\n"
                  )
              history = report.get("discovery_history", {})
              handle.write(f"\\nScan durability: `{history.get('state')}` across `{history.get('run_count')}` scans\\n")
              if history.get("persisted_signals"):
                  handle.write(f"- Persisted signals: `{history.get('persisted_signals')}`\\n")
              handle.write("\\nResults are unverified leads; no trade signal or order is produced.\\n")
          PY
      - name: Persist the current scheduled narrative feed
        id: persist_feed
        if: ${{ env.TOPIC == 'crypto narratives' && env.CHAIN == 'unknown' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const decision = JSON.parse(
              fs.readFileSync('discovery-notification.json', 'utf8')
            );
            const title = '[RADAR FEED] Narrative discoveries';
            const body = fs.readFileSync('narrative-discovery.md', 'utf8');
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              }
            );
            const existing = issues.find(
              (issue) => !issue.pull_request
                && issue.title === title
                && issue.user?.login === 'github-actions[bot]'
            );
            let issueNumber;
            if (!existing) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              issueNumber = created.data.number;
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              issueNumber = existing.number;
            }
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('notify', String(Boolean(decision.notify)));
            core.setOutput('reason', String(decision.reason || 'unknown'));
            core.info(`Current scheduled narrative feed refreshed: ${decision.reason}`);
      - name: Notify on a material narrative update
        if: ${{ steps.persist_feed.outputs.notify == 'true' }}
        uses: actions/github-script@v7
        env:
          FEED_ISSUE_NUMBER: ${{ steps.persist_feed.outputs.issue_number }}
          NOTIFICATION_REASON: ${{ steps.persist_feed.outputs.reason }}
        with:
          script: |
            const issueNumber = Number(process.env.FEED_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('The canonical narrative feed issue number was invalid.');
              return;
            }
            const current = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const assignees = (current.data.assignees || []).map(
              (assignee) => assignee.login
            );
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'open',
              assignees: assignees.includes(context.repo.owner)
                ? assignees
                : [...assignees, context.repo.owner],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '<!-- narrative-radar-discovery-alert -->',
                '## Scheduled narrative evidence changed',
                '',
                `Reason: \`${process.env.NOTIFICATION_REASON || 'material_change'}\``,
                '',
                'The issue body now contains the latest full source snapshot.',
                '',
                '**Research leads only—not an automatic buy signal.**',
              ].join('\n'),
            });
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: narrative-radar-discovery
          path: |
            narrative-discovery.json
            narrative-discovery.md
            discovery-notification.json
          retention-days: 7
