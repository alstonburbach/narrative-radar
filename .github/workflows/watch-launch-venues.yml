name: watch Pump.fun and Robinhood launches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch-launch-venues.yml"
      - "app/github_issue_venue.py"
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: narrative-radar-launch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
      ROBINHOOD_BLOCKSCOUT_API_KEY: ${{ secrets.ROBINHOOD_BLOCKSCOUT_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore launch-watch history
        uses: actions/cache@v4
        with:
          path: data/narrative_radar.db
          key: narrative-radar-launch-db-${{ github.run_id }}
          restore-keys: narrative-radar-launch-db-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan exact-contract launch leads
        continue-on-error: true
        shell: bash
        run: |
          set +e
          primary_output="$(mktemp)"
          timeout --signal=TERM --kill-after=10s 180s \
            python -m app.venue_watch_main \
              --venues pump_fun,robinhood_chain \
              --profile-limit-per-venue 12 \
              --candidate-limit 12 \
              --security-limit 8 \
              --onchain-limit 1 \
              --bundler-limit 1 \
              --json > "$primary_output"
          primary_status=$?
          if [ "$primary_status" -eq 0 ] && python -m json.tool "$primary_output" >/dev/null 2>&1; then
            mv "$primary_output" launch-watch.json
            exit 0
          fi

          rm -f "$primary_output"
          echo "Full evidence scan did not finish in time; running a fast fail-closed screen."

          fallback_output="$(mktemp)"
          timeout --signal=TERM --kill-after=10s 60s \
            python -m app.venue_watch_main \
              --venues pump_fun,robinhood_chain \
              --profile-limit-per-venue 8 \
              --candidate-limit 8 \
              --security-limit 4 \
              --onchain-limit 0 \
              --bundler-limit 0 \
              --json > "$fallback_output"
          fallback_status=$?
          if [ "$fallback_status" -eq 0 ] && python -m json.tool "$fallback_output" >/dev/null 2>&1; then
            mv "$fallback_output" launch-watch.json
            exit 0
          fi

          rm -f "$fallback_output"
          echo "Both bounded scans failed; preserving the last valid phone report."
          exit 1
      - name: Render phone report and notification decision
        if: ${{ always() && hashFiles('launch-watch.json') != '' }}
        run: >-
          python -m app.venue_watch_report_main launch-watch.json
          --markdown-output launch-watch.md
          --notification-output launch-notification.json
      - name: Write job summary
        if: ${{ always() && hashFiles('launch-watch.json') != '' }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("launch-watch.json", "r", encoding="utf-8") as handle:
              report = json.load(handle)
          notification = report.get("notification", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Pump.fun + Robinhood Chain launch watch\n")
              handle.write(f"- Status: `{report.get('status')}`\n")
              handle.write(f"- Eligible profiles: `{report.get('eligible_profiles', 0)}`\n")
              handle.write(f"- Ranked candidates: `{report.get('candidate_count', 0)}`\n")
              handle.write(f"- GoPlus scans: `{report.get('security_scans', 0)}`\n")
              handle.write(f"- Helius holder scans: `{report.get('holder_scans', 0)}`\n")
              handle.write(f"- Bounded linked-wallet scans: `{report.get('bundler_scans', 0)}`\n")
              handle.write(f"- Linked-wallet scans by chain: `{report.get('bundler_scans_by_chain', {})}`\n")
              handle.write(f"- New alerts: `{notification.get('candidate_count', 0)}`\n")
              handle.write("- Execution enabled: `false`\n")
          PY
      - name: Refresh the current phone watch and notify on material changes
        if: ${{ always() && hashFiles('launch-notification.json') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const decision = JSON.parse(
              fs.readFileSync('launch-notification.json', 'utf8')
            );
            const title = '[RADAR LAUNCH WATCH] Pump.fun + Robinhood Chain';
            const body = fs.readFileSync('launch-watch.md', 'utf8');
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              }
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );
            if (!existing) {
              if (!decision.notify) {
                core.info(`No launch-watch issue yet: ${decision.reason}`);
                return;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
              return;
            }
            const assignees = (existing.assignees || []).map(
              (assignee) => assignee.login
            );
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
              ...(decision.notify ? {
                state: 'open',
                assignees: assignees.includes(context.repo.owner)
                  ? assignees
                  : [...assignees, context.repo.owner],
              } : {}),
            });
            if (!decision.notify) {
              core.info(`Current phone watch refreshed: ${decision.reason}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });
      - name: Upload bounded launch-watch report
        if: ${{ always() && hashFiles('launch-watch.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: narrative-radar-launch-watch-${{ github.run_id }}
          path: |
            launch-watch.json
            launch-watch.md
