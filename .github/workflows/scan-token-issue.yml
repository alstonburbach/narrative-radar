name: scan token from phone

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: narrative-radar-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[RADAR SCAN]')
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
      ROBINHOOD_BLOCKSCOUT_API_KEY: ${{ secrets.ROBINHOOD_BLOCKSCOUT_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: data/narrative_radar.db
          key: narrative-radar-db-${{ github.run_id }}
          restore-keys: narrative-radar-db-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run owner-requested scan
        continue-on-error: true
        run: >-
          python -m app.issue_scan_main
          --event "$GITHUB_EVENT_PATH"
          --json-output analysis.json
          --markdown-output report.md
      - name: Reply with the radar report
        if: ${{ always() && hashFiles('report.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- narrative-radar-report -->';
            const body = fs.readFileSync('report.md', 'utf8');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload full scan
        if: ${{ always() && hashFiles('analysis.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: narrative-radar-issue-${{ github.event.issue.number }}
          path: analysis.json
