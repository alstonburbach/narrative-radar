name: analyze wallet

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: Solana wallet address
        required: true
        type: string
      limit:
        description: Maximum finalized transactions to inspect
        required: false
        default: "500"
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      WALLET: ${{ inputs.wallet }}
      LIMIT: ${{ inputs.limit }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wallet history
        uses: actions/cache@v4
        with:
          path: data/narrative_radar.db
          key: narrative-radar-wallet-db-${{ github.run_id }}
          restore-keys: narrative-radar-wallet-db-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run wallet analysis
        run: python -m app.wallet_main "$WALLET" --limit "$LIMIT" --json > wallet-analysis.json
      - name: Write job summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("wallet-analysis.json", "r", encoding="utf-8") as handle:
              report = json.load(handle)
          pnl = report.get("pnl", {})
          flow = report.get("external_flow", {})
          profile = pnl.get("strategy_profile", {})
          history = report.get("wallet_history", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Wallet analysis\\n")
              handle.write(f"- Research candidate: `{report.get('research_candidate')}`\\n")
              handle.write(f"- Quality score: `{report.get('quality_score')}`\\n")
              handle.write(f"- Closed trades: `{pnl.get('closed_trades')}`\\n")
              handle.write(f"- Realized PnL by quote asset: `{pnl.get('realized_pnl_by_quote_asset')}`\\n")
              handle.write(f"- Matched fees: `{pnl.get('primary_matched_fees')}`; fee drag=`{pnl.get('primary_fee_drag_pct')}`% of pre-fee realized profit\\n")
              handle.write(f"- Unpriced or missing swap fees: `{report.get('ingestion', {}).get('unpriced_swap_fees', 0)}`\\n")
              handle.write(f"- Largest winning trade share: `{(pnl.get('trade_pnl_stats') or {}).get('largest_win_share_pct')}`\\n")
              handle.write(f"- Observation window: `{profile.get('observed_span_days')}` days; profitable months=`{profile.get('profitable_months')}`; style=`{profile.get('style')}`\\n")
              handle.write(f"- Max realized drawdown: `{profile.get('max_realized_drawdown')}` (`{profile.get('max_realized_drawdown_on_matched_cost_basis_pct')}`% of matched cost)\\n")
              handle.write(f"- External inflow: `${flow.get('external_inflow_usd', 0)}`\\n")
              handle.write(f"- Known inflow sources: `{flow.get('external_inflow_counterparty_count', 0)}`; largest source share=`{flow.get('largest_inflow_source_share_pct')}`\\n")
              handle.write(f"- Strategy repeatability: `{history.get('strategy_classification')}` / `{history.get('state')}` across `{history.get('run_count', 0)}` runs\\n")
              handle.write("\\nCopy-trading execution is disabled.\\n")
          PY
      - name: Upload wallet report
        uses: actions/upload-artifact@v4
        with:
          name: narrative-radar-wallet-analysis
          path: wallet-analysis.json
