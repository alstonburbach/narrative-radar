name: analyze token

on:
  workflow_dispatch:
    inputs:
      contract:
        description: Token contract address
        required: true
        type: string
      chain:
        description: Chain id, such as base or solana
        required: true
        default: unknown
        type: string
      paper_usd:
        description: Optional hypothetical paper amount in USD
        required: false
        default: ""
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      CONTRACT: ${{ inputs.contract }}
      CHAIN: ${{ inputs.chain }}
      PAPER_USD: ${{ inputs.paper_usd }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore narrative history
        uses: actions/cache@v4
        with:
          path: data/narrative_radar.db
          key: narrative-radar-db-${{ github.run_id }}
          restore-keys: narrative-radar-db-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run paper analysis
        run: |
          if [ -n "$PAPER_USD" ]; then
            python -m app.main --contract "$CONTRACT" --chain "$CHAIN" --paper-usd "$PAPER_USD" --json > analysis.json
          else
            python -m app.main --contract "$CONTRACT" --chain "$CHAIN" --json > analysis.json
          fi
          python - <<'PY'
          import json
          import os

          with open("analysis.json", "r", encoding="utf-8") as handle:
              report = json.load(handle)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              market = report.get("market", {})
              score = report.get("score", {})
              red_team = report.get("red_team", {})
              narrative = report.get("narrative_quality", {})
              history = report.get("narrative_history", {})
              onchain = report.get("onchain_activity", {})
              handle.write(f"## {market.get('token_name', 'Token')} ({market.get('token_symbol', 'unknown')})\\n")
              handle.write(f"- Status: `{report.get('status')}`\\n")
              handle.write(f"- Radar score: `{score.get('radar_score')}` ({score.get('rating')})\\n")
              handle.write(f"- Narrative evidence: `{narrative.get('quality_score')}/100` ({narrative.get('classification')})\\n")
              handle.write(f"- Independent domains: `{narrative.get('independent_domain_count')}`\\n")
              handle.write(f"- Syndicated copies excluded: `{narrative.get('syndication', {}).get('collapsed_source_count', 0)}` across `{narrative.get('syndication', {}).get('cluster_count', 0)}` clusters\\n")
              handle.write(f"- Evidence freshness: `{narrative.get('freshness', {}).get('status', 'unknown')}`; recent=`{narrative.get('freshness', {}).get('recent_count', 0)}`, undated=`{narrative.get('freshness', {}).get('undated_count', 0)}`\\n")
              handle.write(f"- Source content matches: `{narrative.get('content_matches')}`\\n")
              handle.write(f"- Counterevidence leads: `{narrative.get('counterevidence_leads')}`\\n")
              handle.write(f"- Evidence trend: `{history.get('state')}` across `{history.get('run_count')}` runs\\n")
              handle.write(f"- On-chain activity: `{onchain.get('status')}`; holders=`{onchain.get('holder_count', 'n/a')}`, transfer txns=`{onchain.get('transfer_transaction_count_24h', 'n/a')}`, active owners=`{onchain.get('unique_active_wallets_24h', 'n/a')}`\\n")
              handle.write(f"- Scanned supply coverage: `{onchain.get('scanned_supply_coverage_pct', 'n/a')}`; largest scanned owner share=`{onchain.get('largest_scanned_owner_share_pct', 'n/a')}`\\n")
              handle.write(f"- On-chain trend: `{onchain.get('history', {}).get('state', 'not_collected')}` across `{onchain.get('history', {}).get('run_count', 0)}` snapshots\\n")
              handle.write(f"- Risk: `{red_team.get('risk_level')}`\\n")
              handle.write(f"- Research: `{report.get('research', {}).get('status')}`\\n")
          PY
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: narrative-radar-analysis
          path: analysis.json